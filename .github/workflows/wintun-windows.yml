name: Wintun Windows probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/wintun-windows.yml
      - .github/scripts/Test-Wintun.ps1
  pull_request:
    paths:
      - .github/workflows/wintun-windows.yml
      - .github/scripts/Test-Wintun.ps1

permissions:
  contents: read

jobs:
  probe:
    name: Wintun (${{ matrix.environment }})
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: host
          - environment: container
            isolation: process
          - environment: container-hyperv
            isolation: hyperv
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Download Wintun 0.14.1
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force probe, results | Out-Null
          Invoke-WebRequest -UseBasicParsing https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile probe/wintun.zip
          Expand-Archive probe/wintun.zip probe/unpacked
          Copy-Item probe/unpacked/wintun/bin/amd64/wintun.dll probe/wintun.dll
          $signature = Get-AuthenticodeSignature probe/wintun.dll
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if ($signature.Status -ne 'Valid') { throw 'Wintun DLL signature is invalid' }
          Get-FileHash probe/wintun.dll -Algorithm SHA256
          Copy-Item .github/scripts/Test-Wintun.ps1 probe/Test-Wintun.ps1
      - name: Probe directly on hosted Windows VM
        if: matrix.environment == 'host'
        run: ./probe/Test-Wintun.ps1 -DllPath ./probe/wintun.dll -ResultPath ./results/result.json
      - name: Probe inside Windows container
        if: matrix.environment != 'host'
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer, Model, HypervisorPresent | Format-List | Out-File results/virtualization.txt -Encoding utf8
          Get-CimInstance Win32_Processor | Select-Object Name, VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions, VMMonitorModeExtensions | Format-List | Out-File results/virtualization.txt -Append -Encoding utf8
          Get-WindowsFeature Hyper-V, Containers | Format-Table | Out-File results/virtualization.txt -Append -Encoding utf8
          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker daemon is unavailable' }
          $os = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0 -or $os -ne 'windows') { throw 'A Windows Docker daemon is required' }
          $image = 'mcr.microsoft.com/windows/servercore:ltsc2022'
          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw 'Windows container image pull failed' }
          docker image inspect $image --format '{{json .RepoDigests}}'
          # Windows Actions job containers are unsupported; launch Docker explicitly.
          docker run --name wintun-probe --isolation=${{ matrix.isolation }} --user ContainerAdministrator `
            --mount "type=bind,source=$($env:GITHUB_WORKSPACE)\probe,target=C:\probe,readonly" `
            --mount "type=bind,source=$($env:GITHUB_WORKSPACE)\results,target=C:\results" `
            $image powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File C:\probe\Test-Wintun.ps1 -DllPath C:\probe\wintun.dll -ResultPath C:\results\result.json
          if ($LASTEXITCODE -ne 0) { throw "Wintun ${{ matrix.isolation }} container probe failed (exit $LASTEXITCODE)" }
      - name: Collect container state and clean up
        if: always() && matrix.environment != 'host'
        run: |
          # Preserve runtime errors even if the guest never reached the probe script.
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force results | Out-Null
          docker inspect wintun-probe | Out-File results/container-inspect.json -Encoding utf8
          docker logs wintun-probe 2>&1 | Out-File results/container-output.txt -Encoding utf8
          docker rm -f wintun-probe
          exit 0
      - name: Publish probe summary
        if: always()
        run: |
          '### Wintun: ${{ matrix.environment }}' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path results/result.json) {
            '```json' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content results/result.json | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            'No probe result was produced. Check setup/container logs; this is not a DLL-load result.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          'Download the wintun-${{ matrix.environment }} artifact for Wintun internal logs, service configuration/status, token privileges, and before/after SetupAPI logs. Missing services or logs are recorded in system-*.txt.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wintun-${{ matrix.environment }}
          path: results/
          if-no-files-found: warn
